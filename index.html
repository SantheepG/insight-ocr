<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InsightOCR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400&text=DocLense&display=swap">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='5' y='3' width='25' height='32' rx='5' fill='%231e5b45'/%3E%3Cpath d='M10.5 11h14M10.5 16h14M10.5 21h7' stroke='white' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='27' cy='27' r='11' fill='white'/%3E%3Ccircle cx='27' cy='27' r='8' fill='white' stroke='%231e5b45' stroke-width='3'/%3E%3Cpath d='M23 25.5h8M23 29.5h5.5' stroke='%231e5b45' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3Cpath d='M33 33l4.5 4.5' stroke='%231e5b45' stroke-width='3.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('doclense-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --bg: #e6ebe8;
    --bg-glow: rgba(120, 190, 160, .22);
    --surface: #fbfcfb;
    --surface-2: #ffffff;
    --sunken: #f0f3f1;
    --ink: #14201b;
    --muted: #5d6e66;
    --line: #dae2dd;
    --line-strong: #c6d2cb;
    --accent: #17503c;
    --accent-2: #226b50;
    --accent-ink: #ffffff;
    --accent-soft: rgba(23, 80, 60, .08);
    --brass: #a98532;
    --logo: #17503c;
    --warn: #f1dfa0;
    --ok: #23765a;
    --err: #b2443b;
    --box: #c9893f;
    --dash: #b5c6bc;
    --shadow-sm: 0 1px 2px rgba(16, 38, 29, .06);
    --shadow: 0 1px 2px rgba(16, 38, 29, .05), 0 12px 32px -12px rgba(16, 38, 29, .16);
    --shadow-lg: 0 2px 4px rgba(16, 38, 29, .06), 0 24px 48px -16px rgba(16, 38, 29, .22);
    --ring: rgba(23, 80, 60, .28);
    --r-lg: 20px;
    --r: 14px;
    --r-sm: 10px;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: var(--sans);
    --ease: cubic-bezier(.22, .61, .36, 1);
    color-scheme: light;
    font-family: var(--sans);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #090e0c;
    --bg-glow: rgba(70, 160, 120, .14);
    --surface: #111916;
    --surface-2: #16201c;
    --sunken: #0d1411;
    --ink: #e4ede8;
    --muted: #8fa699;
    --line: #202c27;
    --line-strong: #2d3d36;
    --accent: #6fcca4;
    --accent-2: #8edcb9;
    --accent-ink: #072015;
    --accent-soft: rgba(111, 204, 164, .10);
    --brass: #d3b25f;
    --logo: #6fcca4;
    --warn: #5a4d17;
    --ok: #84d8ae;
    --err: #f09a90;
    --box: #efae6d;
    --dash: #2f4138;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 34px -12px rgba(0, 0, 0, .6);
    --shadow-lg: 0 2px 4px rgba(0, 0, 0, .35), 0 28px 54px -16px rgba(0, 0, 0, .7);
    --ring: rgba(111, 204, 164, .32);
  }

  * { box-sizing: border-box; }
  *, *::before, *::after {
    transition: background-color .22s var(--ease), color .22s var(--ease), border-color .22s var(--ease),
                box-shadow .22s var(--ease), opacity .22s var(--ease), transform .22s var(--ease), filter .22s var(--ease);
  }
  html, .pane-body, .queue { scroll-behavior: smooth; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(900px 520px at 8% -8%, var(--bg-glow), transparent 70%),
      radial-gradient(700px 480px at 100% 108%, var(--bg-glow), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    letter-spacing: 0;
  }
  h1, h2, th, strong, b { font-weight: 500; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); background-clip: padding-box; border: 3px solid transparent; }
  ::-webkit-scrollbar-track { background: transparent; }

  .zoom { display: inline-flex; align-items: center; gap: 6px; }
  .zoom .step { width: 30px; height: 30px; padding: 0; border: 1px solid var(--line-strong); border-radius: 50%; background: var(--surface-2); cursor: pointer; font-size: 16px; line-height: 1; }
  .zoom .step:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .zoom .pct { min-width: 46px; text-align: center; font-size: 13px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .zoom .fit { padding: 5px 12px; font-size: 12.5px; }
  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: 264px 1fr; grid-template-rows: minmax(0, 1fr) auto; height: 100vh; gap: 20px; padding: 20px 20px 12px; }
  aside {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 16px; }

  /* ---------- brand ---------- */
  .brand { display: flex; align-items: center; gap: 12px; padding: 22px 22px 18px; }
  .logo { flex: none; display: block; filter: drop-shadow(0 4px 8px rgba(23, 80, 60, .22)); }
  h1 { font-family: "Outfit", "Trebuchet MS", var(--sans); font-weight: 400; font-size: 27px; line-height: 1; margin: 0; letter-spacing: .015em; }

  /* ---------- footer ---------- */
  .powered { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
  .kbsl { height: 25px; width: auto; display: block; border-radius: 8px; }
  :root[data-theme="dark"] .kbsl { background: #f8faf9; padding: 3px 10px; }
  footer { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; padding: 0 8px; color: var(--muted); font-size: 12.5px; letter-spacing: .02em; }

  /* ---------- theme switch ---------- */
  .theme { display: inline-flex; gap: 2px; background: var(--sunken); border: 1px solid var(--line); padding: 3px; border-radius: 999px; }
  .theme button { background: none; border: 0; padding: 5px 13px; border-radius: 999px; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500; }
  .theme button:hover { color: var(--ink); }
  .theme button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); box-shadow: var(--shadow-sm), 0 0 0 1px var(--line); }

  /* ---------- upload ---------- */
  .drop {
    margin: 0 18px 16px; padding: 28px 16px 24px; border: 1.5px dashed var(--dash); border-radius: var(--r);
    text-align: center; color: var(--muted); cursor: pointer; width: calc(100% - 36px);
    background: linear-gradient(180deg, var(--sunken), transparent 140%);
    font-size: 13px; line-height: 1.45;
  }
  .drop svg { display: block; margin: 0 auto 12px; width: 38px; height: 38px; padding: 9px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
  .drop strong { color: var(--ink); display: block; margin-bottom: 4px; font-size: 14.5px; }
  .drop.over { transform: scale(1.02); }
  .drop.over, .drop:hover { border-color: var(--accent); background: var(--accent-soft); }
  .drop:hover svg, .drop.over svg { background: var(--accent); color: var(--accent-ink); }

  /* ---------- queue ---------- */
  .queue { list-style: none; margin: 0; padding: 2px 12px; overflow: auto; flex: 1; }
  .queue li { margin-bottom: 4px; position: relative; }
  .queue li button {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left;
    padding: 11px 14px; background: none; border: 0; border-radius: var(--r-sm); cursor: pointer;
  }
  .queue li button:hover { background: var(--sunken); }
  .queue li[aria-current="true"] button { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--line); }
  .queue li[aria-current="true"]::before {
    content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--accent);
  }
  .queue .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; font-size: 14px; }
  .queue .meta { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .queue .state { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
  .queue .state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .55; }
  .state.done { color: var(--ok); } .state.done::before { opacity: 1; }
  .state.error { color: var(--err); } .state.error::before { opacity: 1; }
  .state.working { color: var(--accent); } .state.working::before { opacity: 1; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.7); opacity: .35; } }
  .empty { padding: 14px; color: var(--muted); font-size: 14px; }
  .side-foot { padding: 12px 20px 14px; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); }

  /* ---------- top bar ---------- */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 2px 4px 0; }
  .bar h2 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 20px; flex: 1 1 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn {
    padding: 9px 18px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface-2);
    cursor: pointer; font-size: 14px; font-weight: 500; box-shadow: var(--shadow-sm);
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(0) scale(.98); }
  .btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
  .btn.primary {
    background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: var(--accent-ink); border-color: var(--accent);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 6px 16px -6px var(--ring);
  }
  .btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, var(--accent-2), var(--accent)); filter: brightness(1.08); }
  .link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 8px; border-radius: 8px; font-size: 12.5px; font-weight: 500; }
  .link:hover { background: var(--accent-soft); }

  /* ---------- stats ---------- */
  #statsWrap:empty { display: none; }
  table.stats {
    border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; max-width: 100%;
  }
  table.stats th, table.stats td { padding: 0 26px; text-align: left; white-space: nowrap; }
  table.stats th { color: var(--muted); font-size: 12px; font-weight: 500; padding-top: 13px; padding-bottom: 0; letter-spacing: .02em; }
  table.stats td { font-family: var(--serif); font-variant-numeric: tabular-nums; font-size: 20px; line-height: 1.2; padding-top: 2px; padding-bottom: 13px; }
  table.stats th + th, table.stats td + td { border-left: 1px solid var(--line); }

  /* ---------- panes ---------- */
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  .pane {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow);
    display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden;
  }
  .pane-head { display: flex; align-items: center; gap: 14px; padding: 10px 16px; min-height: 58px; flex-wrap: wrap; }
  .pane-head .grow { flex: 1; color: var(--muted); font-size: 13.5px; font-weight: 500; letter-spacing: .01em; }
  .pager { display: inline-flex; align-items: center; gap: 6px; }
  .pager .step { width: 32px; height: 32px; padding: 0; border: 1px solid var(--line-strong); border-radius: 50%; background: var(--surface-2); cursor: pointer; font-size: 17px; line-height: 1; }
  .pager .step:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .pager .step:active:not(:disabled) { transform: scale(.9); }
  .pager .step:disabled { opacity: .3; cursor: default; }
  .pager select { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .tabs { display: flex; gap: 2px; background: var(--sunken); border: 1px solid var(--line); padding: 3px; border-radius: 999px; }
  .tabs button { background: none; border: 0; padding: 6px 18px; border-radius: 999px; cursor: pointer; color: var(--muted); font-size: 13.5px; font-weight: 500; }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { background: var(--surface-2); color: var(--ink); box-shadow: var(--shadow-sm), 0 0 0 1px var(--line); }
  label.chk { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 500; }
  label.chk:hover { color: var(--ink); }
  label.chk input { accent-color: var(--accent); width: 16px; height: 16px; }

  .pane-body { flex: 1; overflow: auto; min-height: 0; background: var(--sunken); margin: 0 10px 10px; border-radius: var(--r); border: 1px solid var(--line); }
  .preview { padding: 20px; }
  .stage { position: relative; display: inline-block; max-width: 100%; line-height: 0; border-radius: 8px; overflow: hidden; box-shadow: var(--shadow-lg); outline: 1px solid var(--line); }
  .stage img { max-width: 100%; height: auto; display: block; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .stage polygon { fill: rgba(201, 137, 63, .14); stroke: var(--box); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  iframe.pdf { width: 100%; height: 100%; border: 0; display: block; border-radius: var(--r); }

  /* ---------- extracted text ---------- */
  .out { padding: 30px 36px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--serif); font-size: 15.5px; line-height: 1.65; max-width: 80ch; background: transparent; font-weight: 400; }
  .out.json { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12.5px; line-height: 1.65; max-width: none; white-space: pre; padding: 24px 28px; color: var(--ink); }
  .out .page-sep { display: block; margin: 28px 0 14px; padding-top: 14px; border-top: 1px solid var(--line-strong); color: var(--brass); font-family: var(--sans); font-size: 12.5px; font-weight: 600; letter-spacing: .03em; }
  .out .page-sep:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
  mark.low { background: var(--warn); color: inherit; border-radius: 4px; padding: 1px 3px; box-shadow: 0 0 0 1px rgba(169, 133, 50, .35); }
  .out.summary { max-width: 72ch; }
  .sum-foot { display: block; margin-top: 22px; padding-top: 12px; border-top: 1px solid var(--line-strong); color: var(--muted); font-family: var(--sans); font-size: 12.5px; white-space: normal; }
  .note { padding: 26px 30px; color: var(--muted); font-size: 14.5px; }
  .note.err { color: var(--err); }
  .center {
    display: grid; place-items: center; flex: 1; color: var(--muted); text-align: center; padding: 24px; font-family: var(--serif); font-size: 16px;
    background: var(--surface); border: 1px dashed var(--dash); border-radius: var(--r-lg);
  }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 10px; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* one reveal when a file is opened */
  @keyframes reveal { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .split .pane, #statsWrap > table { animation: reveal .3s var(--ease) both; }
  .split .pane:nth-child(2) { animation-delay: .05s; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translate(-50%, 10px); background: var(--ink); color: var(--bg);
    padding: 11px 20px; border-radius: 999px; opacity: 0; pointer-events: none; box-shadow: var(--shadow-lg); font-size: 14px; font-weight: 500;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; min-height: 100vh; padding: 12px; gap: 14px; }
    aside { max-height: 42vh; }
    .split { grid-template-columns: 1fr; gap: 14px; }
    .pane { min-height: 400px; }
    .out { padding: 22px 22px; }
    table.stats { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="DocLens logo">
        <rect x="5" y="3" width="25" height="32" rx="5" fill="var(--logo)"/>
        <path d="M10.5 11h14M10.5 16h14M10.5 21h7" stroke="var(--surface)" stroke-width="2" stroke-linecap="round" fill="none"/>
        <circle cx="27" cy="27" r="11" fill="var(--surface)"/>
        <circle cx="27" cy="27" r="8" fill="var(--surface)" stroke="var(--logo)" stroke-width="3"/>
        <path d="M23 25.5h8M23 29.5h5.5" stroke="var(--logo)" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M33 33l4.5 4.5" stroke="var(--logo)" stroke-width="3.6" stroke-linecap="round" fill="none"/>
      </svg>
      <h1>InsightOCR</h1>
    </div>
    <button class="drop" id="drop" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
      <strong>Drop files or click to upload</strong>
      Images and PDFs. You can also paste an image.
    </button>
    <input id="file" type="file" accept="image/*,application/pdf" multiple hidden>
    <ul class="queue" id="queue" aria-label="Uploaded files"></ul>
    <div class="side-foot">
      <span id="queueCount" class="state"></span>
      <button class="link" id="clear" type="button">Clear all</button>
    </div>
  </aside>

  <main>
    <div class="bar">
      <h2 id="title">No file selected</h2>
      <button class="btn" id="copy" type="button" disabled>Copy text</button>
      <button class="btn primary" id="download" type="button" disabled>Download .txt</button>
      <div class="theme" role="group" aria-label="Theme">
        <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
    <div id="statsWrap"></div>
    <div id="view" class="center">Upload a file to extract its text.</div>
  </main>

  <footer>
    <span>&copy; 2026 InsightOCR</span>
    <!-- KBSL logo: replace src below with your original base64 data URI (or place kbsl-logo.png next to this file). -->
    <span class="powered">Powered by KBSL
        <!-- <img class="kbsl" src="kbsl_logo.png" alt="" width="256" height="121" > -->
    </span>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const LOW = 0.8;                      // words below this confidence can be highlighted
  const $ = id => document.getElementById(id);
  const items = [];                     // {id, file, url, isPdf, status, result, error, ms}
  let current = null;                   // selected item id
  let tab = 'text';
  let showLow = true, showBoxes = false;
  let nextId = 1, running = false;
  const seen = new Set();             // queue rows already shown (only new ones animate in)

  // ---------- intake ----------
  const drop = $('drop'), input = $('file');
  drop.addEventListener('click', () => input.click());
  input.addEventListener('change', () => { addFiles(input.files); input.value = ''; });
  ['dragenter', 'dragover'].forEach(e => document.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(e => document.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
  document.addEventListener('drop', ev => addFiles(ev.dataTransfer.files));
  document.addEventListener('paste', ev => addFiles([...ev.clipboardData.files]));

  function addFiles(list) {
    const files = [...list].filter(f => f.type.startsWith('image/') || f.type === 'application/pdf' || /\.(pdf|png|jpe?g|bmp|gif|tiff?|webp)$/i.test(f.name));
    if (!files.length) { if (list.length) toast('Only images and PDFs are supported'); return; }
    for (const file of files) {
    //   items.push({
    //     id: nextId++, file, url: URL.createObjectURL(file),
    //     isPdf: file.type === 'application/pdf' || /\.pdf$/i.test(file.name),
    //     status: 'queued', result: null, error: null, ms: 0, page: 0
    //   });
    items.push({
        id: nextId++, file, url: URL.createObjectURL(file),
        isPdf: file.type === 'application/pdf' || /\.pdf$/i.test(file.name),
        status: 'queued', result: null, error: null, ms: 0, page: 0,
        zoom: 1, baseW: 0, pdfZoom: 0
    });
    }
    // if (current === null) current = items[items.length - files.length].id;
    current = items[items.length - 1].id;
    renderQueue(); renderMain(); pump();
    const active = document.querySelector('.queue [aria-current="true"]');
    if (active) active.scrollIntoView({ block: 'nearest' });
    renderQueue(); renderMain(); pump();
  }

  // ---------- OCR queue (one request at a time; the engine handles one image at once) ----------
  async function pump() {
    if (running) return;
    running = true;
    let it;
    while ((it = items.find(i => i.status === 'queued'))) {
      it.status = 'working'; renderQueue(); if (it.id === current) renderMain();
      const t0 = performance.now();
      try {
        const res = await fetch('/', { method: 'POST', body: it.file });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `Server returned ${res.status}`);
        it.result = data;
        it.status = 'done';
        if (data.error) { it.status = 'error'; it.error = data.error; }
      } catch (e) {
        it.status = 'error';
        it.error = e.message === 'Failed to fetch' ? 'Cannot reach the OCR server. Is oneocr_serve running?' : e.message;
      }
      it.ms = performance.now() - t0;
      renderQueue(); if (it.id === current) renderMain();
    }
    running = false;
  }

  // ---------- helpers ----------
  const pagesOf = r => r ? (r.pages || [r]) : [];
  const wordsOf = r => pagesOf(r).flatMap(p => p.lines || []).flatMap(l => l.words || []);
  const fmtSize = n => n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
  const sel = () => items.find(i => i.id === current);
  // it.page: index of the page shown, or -1 for all pages
  const shownPages = it => { const p = pagesOf(it.result); return it.page >= 0 && it.page < p.length ? [p[it.page]] : p; };
  const shownText = it => shownPages(it).map(p => p.text || '').join('\n\n');
  function setPage(it, n) {
    const total = pagesOf(it.result).length;
    it.page = Math.max(-1, Math.min(total - 1, n));
    renderMain();
  }
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1600); }
  function el(tag, props = {}, ...kids) {
    const n = Object.assign(document.createElement(tag), props);
    kids.forEach(k => n.append(k));
    return n;
  }

  // ---------- queue list ----------
  function renderQueue() {
    const q = $('queue'); q.replaceChildren();
    if (!items.length) q.append(el('li', { className: 'empty', textContent: 'No files yet.' }));
    for (const it of [...items].reverse()) {
      const label = { queued: 'Queued', working: 'Reading…', done: 'Done', error: 'Failed' }[it.status];
      const meta = it.status === 'done'
        ? `${wordsOf(it.result).length} words · ${(it.ms / 1000).toFixed(1)} s`
        : fmtSize(it.file.size);
      const b = el('button', { type: 'button' },
        el('span', { className: 'name', textContent: it.file.name, title: it.file.name }),
        el('span', { className: 'state ' + it.status, textContent: label }),
        el('span', { className: 'meta', textContent: meta }));
      b.addEventListener('click', () => { current = it.id; renderQueue(); renderMain(); });
      const li = el('li', {}, b);
      if (!seen.has(it.id)) { li.className = 'enter'; seen.add(it.id); }
      if (it.id === current) li.setAttribute('aria-current', 'true');
      q.append(li);
    }
    const done = items.filter(i => i.status === 'done' || i.status === 'error').length;
    $('queueCount').textContent = items.length ? `${done} of ${items.length} finished` : '';
  }

  $('clear').addEventListener('click', () => {
    items.forEach(i => URL.revokeObjectURL(i.url));
    items.length = 0; current = null; renderQueue(); renderMain();
  });

  // ---------- main view ----------
  function renderMain() {
    const it = sel();
    const view = $('view'), statsWrap = $('statsWrap');
    statsWrap.replaceChildren();
    $('copy').disabled = $('download').disabled = !(it && it.status === 'done');
    $('copy').textContent = it && it.status === 'done' && pagesOf(it.result).length > 1 && it.page >= 0 ? 'Copy page' : 'Copy text';

    if (!it) {
      $('title').textContent = 'No file selected';
      view.className = 'center'; view.replaceChildren('Upload a file to extract its text.');
      return;
    }
    $('title').textContent = it.file.name;

    if (it.status === 'done') statsWrap.append(statsTable(it));

    view.className = 'split'; view.replaceChildren(sourcePane(it), resultPane(it));
  }

  function statsTable(it) {
    const pages = pagesOf(it.result);
    const lines = pages.reduce((n, p) => n + (p.lines || []).length, 0);
    const words = wordsOf(it.result);
    const confs = words.map(w => w.confidence).filter(c => typeof c === 'number');
    const avg = confs.length ? (confs.reduce((a, b) => a + b, 0) / confs.length * 100).toFixed(1) + '%' : '–';
    const low = confs.filter(c => c < LOW).length;
    const t = el('table', { className: 'stats' });
    t.append(
      el('thead', {}, el('tr', {}, ...['Pages', 'Lines', 'Words', 'Avg confidence', `Words < ${LOW * 100}%`, 'Time'].map(h => el('th', { textContent: h })))),
      el('tbody', {}, el('tr', {}, ...[pages.length, lines, words.length, avg, low, (it.ms / 1000).toFixed(1) + ' s'].map(v => el('td', { textContent: String(v) }))))
    );
    return t;
  }

  function sourcePane(it) {
    const head = el('div', { className: 'pane-head' }, el('span', { className: 'grow', textContent: 'Original' }));
    const body = el('div', { className: 'pane-body' });

if (it.isPdf) {
  const pct   = el('span', { className: 'pct' });
  const minus = el('button', { type: 'button', className: 'step', textContent: '−', title: 'Zoom out' });
  const plus  = el('button', { type: 'button', className: 'step', textContent: '+', title: 'Zoom in' });
  const fit   = el('button', { type: 'button', className: 'btn fit', textContent: 'Fit', title: 'Fit to width' });
  let frame = null;

  const pdfSrc = () =>
    it.url + '#' + (it.page >= 0 ? 'page=' + (it.page + 1) + '&' : '') +
    'zoom=' + (it.pdfZoom ? it.pdfZoom : 'page-width');

    const applyPdfZoom = () => {
        const nf = el('iframe', { className: 'pdf', src: pdfSrc(), title: it.file.name });
        if (frame) frame.replaceWith(nf); else body.append(nf);
        frame = nf;
        pct.textContent = it.pdfZoom ? it.pdfZoom + '%' : 'Fit';
        minus.disabled = !!it.pdfZoom && it.pdfZoom <= 25;
        plus.disabled  = it.pdfZoom >= 500;
        };
        const setPdfZoom = z => {
            it.pdfZoom = Math.max(25, Math.min(500, Math.round(z)));
            applyPdfZoom();
        };

        minus.addEventListener('click', () => setPdfZoom((it.pdfZoom || 100) / 1.25));
        plus.addEventListener('click',  () => setPdfZoom((it.pdfZoom || 100) * 1.25));
        fit.addEventListener('click',   () => { it.pdfZoom = 0; applyPdfZoom(); });

        head.append(el('div', { className: 'zoom' }, minus, pct, plus, fit));
        applyPdfZoom();
    } else {
        const img = el('img', { src: it.url, alt: it.file.name });
        const stage = el('div', { className: 'stage' }, img);
        const preview = el('div', { className: 'preview' }, stage);

        // --- zoom controls ---
        const pct = el('span', { className: 'pct' });
        const minus = el('button', { type: 'button', className: 'step', textContent: '−', title: 'Zoom out' });
        const plus  = el('button', { type: 'button', className: 'step', textContent: '+', title: 'Zoom in' });
        const fit   = el('button', { type: 'button', className: 'btn fit', textContent: 'Fit', title: 'Fit to width' });

        const applyZoom = () => {
        if (it.zoom === 1) {
            stage.style.width = ''; stage.style.maxWidth = ''; img.style.width = '';
        } else {
            stage.style.width = (it.baseW * it.zoom) + 'px';
            stage.style.maxWidth = 'none';
            img.style.width = '100%';
        }
        pct.textContent = Math.round(it.zoom * 100) + '%';
        minus.disabled = it.zoom <= 0.25;
        plus.disabled = it.zoom >= 5;
    };
    const setZoom = z => {
        if (it.zoom === 1) it.baseW = stage.clientWidth || img.clientWidth;  // remember "fit" width
        it.zoom = Math.max(0.25, Math.min(5, Math.round(z * 100) / 100));
        applyZoom();
    };
    minus.addEventListener('click', () => setZoom(it.zoom / 1.25));
    plus.addEventListener('click',  () => setZoom(it.zoom * 1.25));
    fit.addEventListener('click',   () => { it.zoom = 1; applyZoom(); });

    head.append(el('div', { className: 'zoom' }, minus, pct, plus, fit));

    // Ctrl/Cmd + mouse wheel (or trackpad pinch) to zoom
    body.addEventListener('wheel', ev => {
        if (!(ev.ctrlKey || ev.metaKey)) return;
        ev.preventDefault();
        setZoom(it.zoom * (ev.deltaY < 0 ? 1.1 : 1 / 1.1));
    }, { passive: false });

    if (it.status === 'done') {
        const cb = el('input', { type: 'checkbox', checked: showBoxes });
        cb.addEventListener('change', () => { showBoxes = cb.checked; renderMain(); });
        head.append(el('label', { className: 'chk' }, cb, 'Show text boxes'));
        if (showBoxes) img.addEventListener('load', () => stage.append(boxLayer(it, img)));
        if (showBoxes && img.complete) stage.append(boxLayer(it, img));
    }

    applyZoom();
    body.append(preview);
    }
        return el('section', { className: 'pane' }, head, body);
  }

  function boxLayer(it, img) {
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
    svg.setAttribute('preserveAspectRatio', 'none');
    for (const line of (it.result.lines || [])) {
      const r = line.bounding_rect; if (!r) continue;
      const poly = document.createElementNS(NS, 'polygon');
      poly.setAttribute('points', `${r.x1},${r.y1} ${r.x2},${r.y2} ${r.x3},${r.y3} ${r.x4},${r.y4}`);
      svg.append(poly);
    }
    return svg;
  }

  function resultPane(it) {
    const tabs = el('div', { className: 'tabs', role: 'tablist' });
    for (const [key, label] of [['text', 'Text'], ['summary', 'Summary'], ['json', 'JSON']]) {
      const b = el('button', { type: 'button', textContent: label, role: 'tab' });
      b.setAttribute('aria-selected', String(tab === key));
      b.addEventListener('click', () => { tab = key; renderMain(); });
      tabs.append(b);
    }
    const head = el('div', { className: 'pane-head' }, tabs);
    const total = it.status === 'done' ? pagesOf(it.result).length : 0;
    if (total > 1 && tab !== 'summary') head.append(pager(it, total));
    head.append(el('span', { className: 'grow' }));
    if (it.status === 'done' && tab === 'text') {
      const cb = el('input', { type: 'checkbox', checked: showLow });
      cb.addEventListener('change', () => { showLow = cb.checked; renderMain(); });
      head.append(el('label', { className: 'chk' }, cb, 'Highlight uncertain words'));
    }

    if (it.status === 'done' && tab === 'summary' && it.summary && it.summary.status !== 'working') {
      const re = el('button', { type: 'button', className: 'btn fit', textContent: 'Regenerate', title: 'Summarize again' });
      re.addEventListener('click', () => startSummary(it, true));
      head.append(re);
    }

    const body = el('div', { className: 'pane-body' });
    if (it.status === 'queued') body.append(el('div', { className: 'note', textContent: 'Waiting in the queue.' }));
    else if (it.status === 'working') body.append(el('div', { className: 'note' }, el('span', { className: 'spin' }), 'Reading text…'));
    else if (it.status === 'error') body.append(el('div', { className: 'note err', textContent: it.error }));
    else if (tab === 'summary') body.append(summaryView(it));
    else if (tab === 'json') { const sp = shownPages(it); body.append(el('pre', { className: 'out json', textContent: JSON.stringify(sp.length === 1 && !it.result.pages ? it.result : (sp.length === 1 ? sp[0] : it.result), null, 2) })); }
    else body.append(textView(it));
    return el('section', { className: 'pane' }, head, body);
  }

  // ---------- AI summary (server calls OpenAI; the API key never reaches the browser) ----------
  async function startSummary(it, force) {
    if (it.summary && it.summary.status === 'working') return;
    if (!force && it.summary && it.summary.status === 'done') return;
    const text = (it.result && it.result.text || '').trim();
    if (!text) { it.summary = { status: 'error', error: 'No text found in this file, so there is nothing to summarize.' }; return; }
    it.summary = { status: 'working' };
    const refresh = () => { if (current === it.id) renderMain(); };
    refresh();
    try {
      const res = await fetch('/summarize', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Server returned ${res.status}`);
      it.summary = { status: 'done', text: data.summary || '', model: data.model };
    } catch (e) {
      it.summary = { status: 'error', error: e.message === 'Failed to fetch' ? 'Cannot reach the server. Is oneocr_serve running?' : e.message };
    }
    refresh();
  }

  function summaryView(it) {
    if (!it.summary) { startSummary(it); return el('div', { className: 'note' }, el('span', { className: 'spin' }), 'Summarizing…'); }
    const s = it.summary;
    if (s.status === 'working') return el('div', { className: 'note' }, el('span', { className: 'spin' }), 'Summarizing…');
    if (s.status === 'error') {
      const retry = el('button', { type: 'button', className: 'btn fit', textContent: 'Try again' });
      retry.addEventListener('click', () => startSummary(it, true));
      return el('div', { className: 'note err' }, s.error + ' ', retry);
    }
    const out = el('div', { className: 'out summary' }, s.text || 'The summary came back empty.');
    if (s.model) out.append(el('span', { className: 'sum-foot', textContent: `Generated by ${s.model}. AI summaries can contain mistakes; check against the original text.` }));
    return out;
  }

  function pager(it, total) {
    const prev = el('button', { type: 'button', className: 'step', textContent: '‹', title: 'Previous page (←)', disabled: it.page === 0 });
    const next = el('button', { type: 'button', className: 'step', textContent: '›', title: 'Next page (→)', disabled: it.page === total - 1 });
    prev.addEventListener('click', () => setPage(it, (it.page < 0 ? 0 : it.page - 1)));
    next.addEventListener('click', () => setPage(it, it.page + 1));
    const s = el('select', { title: 'Go to page', ariaLabel: 'Page' });
    s.append(el('option', { value: '-1', textContent: `All pages (${total})` }));
    for (let i = 0; i < total; i++) s.append(el('option', { value: String(i), textContent: `Page ${i + 1} of ${total}` }));
    s.value = String(it.page);
    s.addEventListener('change', () => setPage(it, Number(s.value)));
    return el('div', { className: 'pager' }, prev, s, next);
  }

  function textView(it) {
    const out = el('div', { className: 'out' });
    const pages = shownPages(it);
    if (!shownText(it).trim()) { out.className = 'note'; out.textContent = 'No text found in this file.'; return out; }

    pages.forEach((p, i) => {
      if (pages.length > 1) out.append(el('span', { className: 'page-sep', textContent: `Page ${p.page || i + 1}` }));
      if (!showLow) { out.append(p.text || ''); out.append('\n'); return; }
      for (const line of (p.lines || [])) {
        const words = line.words || [];
        if (!words.length) { out.append(line.text || '', '\n'); continue; }
        words.forEach((w, k) => {
          if (k) out.append(' ');
          if (typeof w.confidence === 'number' && w.confidence < LOW)
            out.append(el('mark', { className: 'low', textContent: w.text, title: `${(w.confidence * 100).toFixed(0)}% confidence` }));
          else out.append(w.text || '');
        });
        out.append('\n');
      }
    });
    return out;
  }

  // ---------- actions ----------
  $('copy').addEventListener('click', async () => {
    const it = sel(); if (!it || !it.result) return;
    try { await navigator.clipboard.writeText(shownText(it)); toast(it.page >= 0 && pagesOf(it.result).length > 1 ? `Page ${it.page + 1} copied` : 'Text copied'); }
    catch { toast('Copy failed. Select the text and copy it manually.'); }
  });

  $('download').addEventListener('click', () => {
    const it = sel(); if (!it || !it.result) return;
    const blob = new Blob([it.result.text || ''], { type: 'text/plain;charset=utf-8' });
    const a = el('a', { href: URL.createObjectURL(blob), download: it.file.name.replace(/\.[^.]+$/, '') + '.txt' });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  document.addEventListener('keydown', ev => {
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName) || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const it = sel();
    if (!it || it.status !== 'done' || pagesOf(it.result).length < 2) return;
    if (ev.key === 'ArrowRight' || ev.key === 'PageDown') { ev.preventDefault(); setPage(it, it.page < 0 ? 0 : it.page + 1); }
    else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') { ev.preventDefault(); setPage(it, it.page < 0 ? 0 : it.page - 1); }
  });

  // ---------- theme ----------
  function applyTheme(t, save) {
    document.documentElement.dataset.theme = t;
    document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet === t)));
    if (save) { try { localStorage.setItem('doclense-theme', t); } catch (e) {} }
  }
  document.querySelectorAll('[data-theme-set]').forEach(b => b.addEventListener('click', () => applyTheme(b.dataset.themeSet, true)));
  applyTheme(document.documentElement.dataset.theme, false);

  renderQueue();
})();
</script>
</body>
</html>
